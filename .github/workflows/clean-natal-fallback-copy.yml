name: Clean natal fallback copy

on:
  push:
    branches:
      - feat/natal-meaning-map-20260903

permissions:
  contents: write

concurrency:
  group: clean-natal-fallback-copy
  cancel-in-progress: false

jobs:
  clean-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/natal-meaning-map-20260903
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean the rare old-reader copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding='utf-8')

          hub_path = 'components/NatalReading/NatalReportHub.tsx'
          hub = read(hub_path)
          hub, count = re.subn(
              r"function accessLabel\([\s\S]*?\n\}\n\n(?=type LegacyNatalReportHubProps)",
              """function accessLabel(
            accessState: NatalTopicAccessState,
            language: 'ru' | 'en',
            premiumLoading: boolean,
          ): string {
            if (accessState === 'open') return language === 'ru' ? 'Открыто' : 'Open';
            if (accessState === 'premium') {
              if (premiumLoading) return language === 'ru' ? 'Готовим' : 'Preparing';
              return language === 'ru' ? 'Продолжение' : 'More';
            }
            return language === 'ru' ? 'Продолжение' : 'More';
          }
          """.replace('\n          ', '\n').lstrip(),
              hub,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'{hub_path}: accessLabel match count={count}')
          write(hub_path, hub)

          human_path = 'components/NatalReading/HumanReport.tsx'
          human = read(human_path)
          replacements = {
              "'Первый вопрос по карте — бесплатно.'": "'Сейчас можно задать один вопрос.'",
              "'Your first chart question is free.'": "'You can ask one question now.'",
          }
          for old, new in replacements.items():
              count = human.count(old)
              if count != 1:
                  raise RuntimeError(f'{human_path}: {old} match count={count}')
              human = human.replace(old, new, 1)
          write(human_path, human)

          story_path = 'components/NatalReading/NatalStoryDeck.tsx'
          story = read(story_path)
          old = "return 'Этот раздел доступен в Premium.';"
          new = "return 'Этот раздел пока закрыт.';"
          count = story.count(old)
          if count != 1:
              raise RuntimeError(f'{story_path}: locked copy match count={count}')
          write(story_path, story.replace(old, new, 1))
          PY

      - name: Install and verify
        run: |
          npm ci
          npm test -- --runInBand \
            __tests__/natal-meaning-experience.test.ts \
            __tests__/natal-reading-variant.test.ts \
            __tests__/natal-catalog-contract.test.ts \
            __tests__/natal-catalog-repair-diagnostics.test.ts
          npx tsc --noEmit
          npm run build

      - name: Commit only the copy cleanup
        shell: bash
        run: |
          rm -f .github/workflows/clean-natal-fallback-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/NatalReading/NatalReportHub.tsx \
                  components/NatalReading/HumanReport.tsx \
                  components/NatalReading/NatalStoryDeck.tsx \
                  .github/workflows/clean-natal-fallback-copy.yml
          git diff --cached --check
          git commit -m "fix(natal): keep fallback copy human"
          git push origin HEAD:feat/natal-meaning-map-20260903
