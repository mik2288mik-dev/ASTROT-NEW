name: Export current NEBO APK

on:
  push:
    branches:
      - ops/chat-apk-artifact-20260827

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public API DNS and TLS routing
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          dig +noall +answer api.tvoi-goroskop.ru A
          dig +noall +answer api.tvoi-goroskop.ru CNAME
          dig +noall +answer _railway-verify.api.tvoi-goroskop.ru TXT
          dig +noall +answer tvoi-goroskop.ru NS
          echo '=== VERIFIED TLS ==='
          curl -fsv --connect-timeout 10 --max-time 20 \
            "https://api.tvoi-goroskop.ru/api/health" \
            -o api-health.txt 2>api-health-curl.txt
          verified_rc=$?
          cat api-health-curl.txt || true
          cat api-health.txt || true
          echo "verified_curl_exit=$verified_rc"
          echo '=== ROUTING WITH TLS VERIFY DISABLED ==='
          curl -ksS -D - --connect-timeout 10 --max-time 20 \
            "https://api.tvoi-goroskop.ru/api/health" \
            -o api-health-insecure.txt
          insecure_rc=$?
          cat api-health-insecure.txt || true
          echo "insecure_curl_exit=$insecure_rc"
          exit "$verified_rc"

      - name: Download current signed APK from Railway
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            "https://nebo-auth-test-apk-production.up.railway.app/nebo-auth-test.apk" \
            -o NEBO-current.apk
          test -s NEBO-current.apk
          unzip -tq NEBO-current.apk >/dev/null
          sha256sum NEBO-current.apk | tee SHA256SUMS.txt
          ls -lh NEBO-current.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBO-current-probe
          path: |
            NEBO-current.apk
            SHA256SUMS.txt
            api-health*.txt
          if-no-files-found: error
          retention-days: 1
