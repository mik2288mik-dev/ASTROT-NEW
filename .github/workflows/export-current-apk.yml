name: Export current NEBO APK

on:
  push:
    branches:
      - ops/chat-apk-artifact-20260827

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download current signed APK from Railway
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            "https://nebo-auth-test-apk-production.up.railway.app/nebo-auth-test.apk" \
            -o NEBO-native-http-fix.apk
          test -s NEBO-native-http-fix.apk
          unzip -tq NEBO-native-http-fix.apk >/dev/null
          rm -rf apk-check && mkdir apk-check
          unzip -q NEBO-native-http-fix.apk -d apk-check
          grep -R -a -q 'astrot-production.up.railway.app' apk-check
          if grep -R -a -q 'api.tvoi-goroskop.ru' apk-check; then
            echo 'Broken custom API domain is still embedded in APK' >&2
            exit 1
          fi
          test -f apk-check/assets/capacitor.config.json
          cat apk-check/assets/capacitor.config.json | tee CAPACITOR-CONFIG.txt
          grep -q '"CapacitorHttp"' CAPACITOR-CONFIG.txt
          grep -q '"enabled":true' CAPACITOR-CONFIG.txt
          sha256sum NEBO-native-http-fix.apk | tee SHA256SUMS.txt
          ls -lh NEBO-native-http-fix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBO-native-http-fix
          path: |
            NEBO-native-http-fix.apk
            SHA256SUMS.txt
            CAPACITOR-CONFIG.txt
          if-no-files-found: error
          retention-days: 1
