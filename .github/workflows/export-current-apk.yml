name: Export current NEBO APK

on:
  push:
    branches:
      - ops/chat-apk-artifact-20260827

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download current signed APK from Railway
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors \
            "https://nebo-auth-test-apk-production.up.railway.app/nebo-auth-test.apk" \
            -o NEBO-fixed-api-domain.apk
          test -s NEBO-fixed-api-domain.apk
          unzip -tq NEBO-fixed-api-domain.apk >/dev/null
          sha256sum NEBO-fixed-api-domain.apk | tee SHA256SUMS.txt
          ls -lh NEBO-fixed-api-domain.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBO-fixed-api-domain
          path: |
            NEBO-fixed-api-domain.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
