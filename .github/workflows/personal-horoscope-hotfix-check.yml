name: Personal Horoscope Runtime Hotfix Check

on:
  push:
    paths:
      - 'lib/aiPersonalHoroscopeGeneration.ts'
      - 'lib/aiPersonalHoroscopePackage.ts'
      - 'services/contentPrewarmService.ts'
      - '__tests__/personal-horoscope-runtime-resilience.test.ts'
      - '.github/workflows/personal-horoscope-hotfix-check.yml'
  pull_request:
    paths:
      - 'lib/aiPersonalHoroscopeGeneration.ts'
      - 'lib/aiPersonalHoroscopePackage.ts'
      - 'services/contentPrewarmService.ts'
      - '__tests__/personal-horoscope-runtime-resilience.test.ts'
      - '.github/workflows/personal-horoscope-hotfix-check.yml'

jobs:
  focused-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Runtime resilience tests
        run: >-
          npm test -- --runInBand --forceExit
          __tests__/personal-horoscope-runtime-resilience.test.ts
          __tests__/ai-personal-horoscope-generation.test.ts
          __tests__/personal-forecast-service.test.ts
          __tests__/personal-forecast-history-cache.test.ts
