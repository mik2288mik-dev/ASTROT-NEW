name: NEBO admin design pilot validation
on:
  push:
    branches: [nebo-admin-redesign-20260907]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nebo-admin-design-pilot
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/nebo-admin-redesign-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horoscope
          POSTGRES_PASSWORD: horoscope
          POSTGRES_DB: horoscope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U horoscope -d horoscope_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
      APP_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact browser-tested hardening and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/nebo-admin-hardening.mjs ]; then
            node scripts/nebo-admin-hardening.mjs
            node scripts/nebo-admin-hardening.mjs
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Admin, concurrency, natal and navigation contracts
        env:
          NODE_ENV: test
        run: >-
          npx jest --runInBand --runTestsByPath
          __tests__/nebo-admin-design.test.ts
          __tests__/nebo-preference-concurrency.test.ts
          __tests__/natal-catalog-ui-contract.test.ts
          __tests__/natal-meaning-map-v3.test.ts
          __tests__/personal-forecast-header-logo.test.ts
      - name: Migrations against isolated PostgreSQL
        env:
          NODE_ENV: test
        run: npm run migrate
      - name: Confirm additive preference schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({connectionString: process.env.DATABASE_URL});
          await client.connect();
          const {rows} = await client.query("SELECT column_name FROM information_schema.columns WHERE table_name='user_design_preferences'");
          for (const key of ['user_id','preferences','revision','updated_at']) if (!rows.some(r=>r.column_name===key)) throw new Error('Missing preference column: '+key);
          await client.end();
          console.log('Preference schema verified against isolated test database.');
          NODE
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Commit checked source to pilot branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/nebo-admin-redesign-20260907
          remote=$(git ls-remote origin refs/heads/nebo-admin-redesign-20260907 | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch changed; refusing stale write'; exit 1; }
          git config user.name 'NEBO validation'
          git config user.email 'nebo-validation@users.noreply.github.com'
          git add -- lib/neboDesign/preferenceStore.ts lib/neboDesign/contract.ts lib/neboDesign/layeredSurface.ts components/nebo-v2/LayeredSurface.tsx components/nebo-v2/NeboDesignControl.tsx components/nebo-v2/NeboDashboard.tsx components/nebo-v2/NeboNatal.tsx styles/neboV2.css __tests__/liquid-glass-chrome.test.ts __tests__/personal-forecast-header-logo.test.ts __tests__/today-navigation-shell.test.ts __tests__/natal-catalog-ui-contract.test.ts __tests__/natal-meaning-map-v3.test.ts
          for file in scripts/nebo-admin-hardening.mjs scripts/nebo-redesign-integrate.mjs scripts/nebo-pilot-finalize.mjs .github/workflows/nebo-reference-check.yml; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then git rm -- "$file"; fi
          done
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): verify and harden admin NEBO preview for main'
            git push origin HEAD:refs/heads/nebo-admin-redesign-20260907
          fi
          echo "Validated pilot commit: $(git rev-parse HEAD)"
          echo 'Full legacy suite has known baseline failures; this is an opt-in admin pilot, not a full-app release certification.'
