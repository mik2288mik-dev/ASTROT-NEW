name: NEBO admin design pilot validation
on:
  push:
    branches: [nebo-admin-redesign-20260907]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nebo-admin-design-pilot
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horoscope
          POSTGRES_PASSWORD: horoscope
          POSTGRES_DB: horoscope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U horoscope -d horoscope_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
      APP_SESSION_SECRET: ci-session-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Archive exact source for offline review
        run: |
          mkdir -p validation
          git archive --format=tar.gz HEAD > validation/source.tar.gz
          git rev-parse HEAD > validation/source-sha.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Export locked test dependencies for offline verification
        if: github.run_number == 3
        run: tar -czf validation/test-dependencies.tar.gz node_modules
      - name: Upload offline review workspace
        uses: actions/upload-artifact@v4
        with:
          name: nebo-offline-workspace
          retention-days: 2
          compression-level: 0
          path: |
            validation/source.tar.gz
            validation/source-sha.txt
            validation/test-dependencies.tar.gz
      - name: TypeScript
        id: types
        continue-on-error: true
        run: npx tsc --noEmit > validation/typecheck.txt 2>&1
      - name: Migrations against isolated PostgreSQL
        env:
          NODE_ENV: test
        run: npm run migrate > validation/migrations.txt 2>&1
      - name: Full repository tests
        id: tests
        continue-on-error: true
        env:
          NODE_ENV: test
        run: npm test -- --runInBand --json --outputFile=validation/jest.json > validation/tests.txt 2>&1
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > validation/lint.txt 2>&1
      - name: Production build
        id: build
        continue-on-error: true
        env:
          NODE_ENV: production
        run: npm run build > validation/build.txt 2>&1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebo-check-results
          retention-days: 7
          path: |
            validation/*.txt
            validation/jest.json
      - name: Enforce checks
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: test "$TYPES" = success && test "$TESTS" = success && test "$BUILD" = success
