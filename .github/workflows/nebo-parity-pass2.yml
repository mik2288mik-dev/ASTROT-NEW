name: Validate NEBO parity pass 2
on:
  push:
    branches: [nebo-parity-pass2-20260908]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nebo-parity-pass2
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint changed TypeScript
        run: npx eslint components/nebo-v2/NeboDashboard.tsx components/nebo-v2/Primitives.tsx pages/_app.tsx --max-warnings=0
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused tests
        env:
          NODE_ENV: test
        run: npm test -- --runInBand __tests__/personal-forecast-generation.test.ts __tests__/personal-forecast-service.test.ts __tests__/nebo-admin-design.test.ts
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff hygiene
        run: git diff 4d956d13cc6d7bf2d012d06c507f72e9be442a27...HEAD --check
