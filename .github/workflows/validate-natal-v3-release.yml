name: Validate natal meaning map release

on:
  push:
    branches:
      - feat/natal-meaning-map-v3-20260902

permissions:
  contents: read

concurrency:
  group: validate-natal-v3-release
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horoscope
          POSTGRES_PASSWORD: horoscope
          POSTGRES_DB: horoscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horoscope -d horoscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
      APP_SESSION_SECRET: natal-v3-release-session-secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Run natal feature tests
        run: >-
          npm test -- --runInBand
          __tests__/natal-meaning-map-v3.test.ts
          __tests__/natal-reading-variant.test.ts
          __tests__/natal-reading-variant-ui-contract.test.ts
          __tests__/natal-catalog-contract.test.ts
          __tests__/natal-catalog-ui-contract.test.ts
          __tests__/natal-catalog-repair-diagnostics.test.ts
          __tests__/natal-question-policy.test.ts
          __tests__/natal-mobile-interaction-contract.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  screenshots:
    needs: validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_UI_PREVIEW: '1'
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local preview
        shell: bash
        run: |
          NEXT_PUBLIC_UI_PREVIEW=1 npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/natal-v3-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/natal-v3-preview.pid"
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:3000/?uiPreview=1&screen=natal-reading&access=free&state=ready&birthTime=exact" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/natal-v3-preview.log"
          exit 1

      - name: Capture real mobile states
        shell: bash
        run: |
          mkdir -p natal-v3-screenshots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
          });
          const url = 'http://127.0.0.1:3000/?uiPreview=1&screen=natal-reading&access=free&state=ready&birthTime=exact';
          await page.goto(url, { waitUntil: 'networkidle' });
          await page.locator('.natal-v3-experience').waitFor({ state: 'visible' });
          await page.locator('.ui-preview-controls').evaluate((node) => node.remove()).catch(() => undefined);
          await page.screenshot({ path: 'natal-v3-screenshots/01-foundation.png', fullPage: true });

          await page.getByRole('button', { name: 'Разобрать', exact: true }).click();
          await page.locator('.natal-v3-map-node.is-love').click();
          await page.locator('.natal-v3-domain-heading').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'natal-v3-screenshots/02-relationships.png', fullPage: true });

          const questionList = page.locator('.natal-v3-question-list').first();
          await questionList.scrollIntoViewIfNeeded();
          await page.screenshot({ path: 'natal-v3-screenshots/03-relationship-questions.png', fullPage: false });

          await questionList.locator('li button').first().click();
          await page.locator('.natal-v3-answer-sheet').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'natal-v3-screenshots/04-answer-sheet.png', fullPage: false });

          await page.locator('.natal-v3-answer-actions button').first().click();
          await page.locator('.natal-v3-evidence-sheet').waitFor({ state: 'visible' });
          await page.screenshot({ path: 'natal-v3-screenshots/05-why-sheet.png', fullPage: false });

          await browser.close();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: natal-v3-mobile-screenshots
          path: natal-v3-screenshots/*.png
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_MOBILE_BUILD: '1'
      MOBILE_BUILD: '1'
      NEXT_PUBLIC_API_URL: https://api.tvoi-goroskop.ru
      NEXT_PUBLIC_DISTRIBUTION_CHANNEL: rustore
      NEXT_PUBLIC_RUSTORE_PRODUCT_PREMIUM_MONTH: ci.premium.month
      NEXT_PUBLIC_RUSTORE_PRODUCT_PREMIUM_QUARTER: ci.premium.quarter
      NEXT_PUBLIC_RUSTORE_PRODUCT_PREMIUM_YEAR: ci.premium.year
      RUSTORE_ALLOWED_PRODUCT_IDS: ci.premium.month,ci.premium.quarter,ci.premium.year
      RUSTORE_CONSOLE_APP_ID: '100000'
      RUSTORE_PACKAGE_NAME: ru.tvoygoroskop.app
      RUSTORE_PAY_MODE: sandbox
      YANDEX_ANDROID_CLIENT_ID: ci-yandex-android-client
      VK_ANDROID_CLIENT_ID: '100000'
      VK_ID_ANDROID_CLIENT_SECRET: ci-vk-secret-not-for-production
      APP_VERSION_CODE: '20260902'
      APP_VERSION_NAME: 1.0.0-natal-v3-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build and sync mobile bundle
        run: |
          npm run android:validate
          npm run build:mobile
          npx cap sync android

      - name: Build signed test APK
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/natal-v3-test.jks" \
            -storepass natal-v3-test-password \
            -keypass natal-v3-test-password \
            -alias natal-v3-test \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=NEBO Natal V3 Test, OU=CI, O=Not For Publication, C=XX"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/natal-v3-test.jks"
          export RELEASE_STORE_PASSWORD=natal-v3-test-password
          export RELEASE_KEY_ALIAS=natal-v3-test
          export RELEASE_KEY_PASSWORD=natal-v3-test-password
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRustoreDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p natal-v3-apk
          cp android/app/build/outputs/apk/rustore/debug/app-rustore-debug.apk \
            natal-v3-apk/NEBO-natal-v3-test.apk
          sha256sum natal-v3-apk/NEBO-natal-v3-test.apk \
            | tee natal-v3-apk/NEBO-natal-v3-test.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: natal-v3-rustore-debug-apk
          path: natal-v3-apk/*
          if-no-files-found: error
