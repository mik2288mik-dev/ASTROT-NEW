name: Apply natal auto fallback fix

on:
  push:
    branches:
      - fix/natal-admin-variant-and-reliability-20260902

permissions:
  contents: write

concurrency:
  group: natal-auto-fallback-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_SESSION_SECRET: branch-validation-session-secret
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/natal-admin-variant-and-reliability-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-natal-auto-fallback-fix.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one occurrence, found {count}")',
              'if count < 1:\n        raise RuntimeError(f"{label}: expected at least one occurrence, found {count}")',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          python3 scripts/apply-natal-auto-fallback-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: >-
          npm test -- --runInBand
          __tests__/natal-reading-variant.test.ts
          __tests__/natal-reading-variant-ui-contract.test.ts
          __tests__/natal-catalog-repair-diagnostics.test.ts
          __tests__/natal-catalog-contract.test.ts
          __tests__/natal-karma-boundary.test.ts
          __tests__/natal-report-cache-version.test.ts
          __tests__/natal-mobile-interaction-contract.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f \
            scripts/apply-natal-auto-fallback-fix.py \
            .github/workflows/apply-natal-auto-fallback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(natal): use catalog-first auto fallback"
          git push origin HEAD:fix/natal-admin-variant-and-reliability-20260902
