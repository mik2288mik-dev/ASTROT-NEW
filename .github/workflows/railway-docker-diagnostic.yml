name: Railway Docker Diagnostic

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'middleware.ts'
      - '.github/workflows/railway-docker-diagnostic.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Railway image
        shell: bash
        run: |
          set +e
          docker build --progress=plain -t astrot-railway-diagnostic . > /tmp/docker-build.log 2>&1
          status=$?
          echo "===== Docker build tail ====="
          tail -n 180 /tmp/docker-build.log
          exit "$status"
