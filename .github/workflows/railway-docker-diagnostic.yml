name: Railway Docker Diagnostic

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'middleware.ts'
      - '.github/workflows/railway-docker-diagnostic.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Railway image
        shell: bash
        run: |
          set +e
          docker build --progress=plain -t astrot-railway-diagnostic . > /tmp/docker-build.log 2>&1
          echo "$?" > /tmp/docker-build-status
          exit 0

      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-docker-build-log
          path: /tmp/docker-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Report Docker build result
        shell: bash
        run: |
          status="$(cat /tmp/docker-build-status)"
          tail -n 60 /tmp/docker-build.log
          exit "$status"
