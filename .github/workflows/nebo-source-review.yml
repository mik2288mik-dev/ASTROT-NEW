name: NEBO scoped source review
on:
  push:
    branches: [nebo-render-parity-20260907]
    paths: [.github/workflows/nebo-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p evidence
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          git rev-parse HEAD > evidence/sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nebo-exact-source
          path: evidence
          retention-days: 1
          compression-level: 0
