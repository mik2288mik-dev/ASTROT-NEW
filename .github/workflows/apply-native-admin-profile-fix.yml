name: Apply native admin profile fix

on:
  push:
    branches:
      - fix/native-admin-profile-authority-20260902

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_SESSION_SECRET: branch-validation-session-secret
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-admin-profile-authority-20260902
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-native-admin-profile-fix.py
      - run: npm ci
      - run: npm test -- --runInBand __tests__/native-admin-profile-authority.test.ts __tests__/natal-reading-variant.test.ts __tests__/natal-reading-variant-ui-contract.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Commit validated patch
        run: |
          rm -f scripts/apply-native-admin-profile-fix.py .github/workflows/apply-native-admin-profile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(auth): preserve server admin status in native app"
          git push origin HEAD:fix/native-admin-profile-authority-20260902
