name: Validate natal meaning map v3

on:
  push:
    branches:
      - feat/natal-meaning-map-v3-20260902

permissions:
  contents: write

concurrency:
  group: natal-meaning-map-v3
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horoscope
          POSTGRES_PASSWORD: horoscope
          POSTGRES_DB: horoscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horoscope -d horoscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
      APP_SESSION_SECRET: natal-v3-ci-session-secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/natal-meaning-map-v3-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Validate tests, types and production build
        shell: bash
        run: |
          set +e
          npm test -- --runInBand \
            __tests__/natal-meaning-map-v3.test.ts \
            __tests__/natal-reading-variant.test.ts \
            __tests__/natal-reading-variant-ui-contract.test.ts \
            __tests__/natal-catalog-contract.test.ts \
            __tests__/natal-catalog-repair-diagnostics.test.ts \
            __tests__/natal-question-policy.test.ts \
            __tests__/natal-mobile-interaction-contract.test.ts \
            > "$RUNNER_TEMP/natal-v3-tests.log" 2>&1
          TEST_STATUS=$?

          npx tsc --noEmit > "$RUNNER_TEMP/natal-v3-tsc.log" 2>&1
          TSC_STATUS=$?

          npm run build > "$RUNNER_TEMP/natal-v3-build.log" 2>&1
          BUILD_STATUS=$?
          set -e

          TEST_STATUS="$TEST_STATUS" TSC_STATUS="$TSC_STATUS" BUILD_STATUS="$BUILD_STATUS" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          statuses = {
              'focused_tests': int(os.environ['TEST_STATUS']),
              'typescript': int(os.environ['TSC_STATUS']),
              'production_build': int(os.environ['BUILD_STATUS']),
          }
          lines = [f"head={os.environ.get('GITHUB_SHA', '')}"]
          for name, status in statuses.items():
              lines.append(f"{name}={'PASS' if status == 0 else 'FAIL'}")
          for title, filename in (
              ('FOCUSED TESTS', 'natal-v3-tests.log'),
              ('TYPESCRIPT', 'natal-v3-tsc.log'),
              ('PRODUCTION BUILD', 'natal-v3-build.log'),
          ):
              path = root / filename
              content = path.read_text(encoding='utf-8', errors='replace').splitlines() if path.exists() else []
              lines.extend(['', f'===== {title} ====='])
              lines.extend(content[-500:])
          Path('natal-v3-validation.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add natal-v3-validation.txt
          git commit -m "chore(natal): record meaning-map validation" || exit 0
          git push origin HEAD:feat/natal-meaning-map-v3-20260902
