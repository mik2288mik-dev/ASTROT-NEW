name: NEBO original main reference
on:
  push:
    branches: [nebo-admin-redesign-20260907]
    paths: [.github/workflows/nebo-reference-check.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horoscope
          POSTGRES_PASSWORD: horoscope
          POSTGRES_DB: horoscope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U horoscope -d horoscope_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
      APP_SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 653908a21395e73626cff9b725a7132f712bfcd3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - name: Baseline tests
        continue-on-error: true
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/sha.txt
          git archive --format=tar.gz HEAD > evidence/main-source.tar.gz
          npm test -- --runInBand --json --outputFile=evidence/jest.json > evidence/tests.txt 2>&1
      - name: Baseline lint
        continue-on-error: true
        run: npm run lint > evidence/lint.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nebo-original-main-reference
          retention-days: 2
          path: evidence
