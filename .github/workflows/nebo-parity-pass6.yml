name: Validate NEBO parity pass 6
on:
  push:
    branches: [nebo-parity-pass6-20260908]
permissions:
  contents: write
concurrency:
  group: nebo-parity-pass6
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/nebo-pass6-integrate.mjs
      - run: npm ci --no-audit --no-fund
      - name: Lint people and compatibility adapters
        run: npx eslint components/nebo-v2/NeboMyCharts.tsx components/nebo-v2/NeboUnionRoom.tsx components/nebo-v2/EntryPoints.tsx App.tsx pages/_app.tsx --max-warnings=0
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Saved people and compatibility tests
        run: npx jest --runInBand __tests__/saved-chart-time-input.test.ts __tests__/loading-screen.test.ts __tests__/synastry-client-delivery.test.ts __tests__/forecast-synastry-access-integration.test.ts
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff hygiene
        run: |
          git diff --check
          git diff --name-only origin/main...HEAD
          git diff --name-only | sort
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NEBO validation'
          git config user.email 'nebo-validation@users.noreply.github.com'
          git add App.tsx pages/_app.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ui): integrate native NEBO people and saved flow'
            git push origin HEAD:refs/heads/nebo-parity-pass6-20260908
          fi
