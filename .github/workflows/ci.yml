name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-direct-natal-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horoscope
          POSTGRES_PASSWORD: horoscope
          POSTGRES_DB: horoscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horoscope -d horoscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
      APP_SESSION_SECRET: ci-session-secret-not-for-production
      NODE_ENV: test

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/natal-reading-variants-20260902

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore canonical files and apply direct patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout 54cced79a292dd6cae79db929a0089ea41951021 -- \
            views/Settings.tsx \
            components/NatalReading/NatalCatalogReport.tsx \
            services/natalCatalogService.ts \
            lib/natalReading/reportCatalogGeneration.ts
          rm -f \
            views/SettingsBase.tsx \
            components/NatalReading/NatalCatalogReportBase.tsx \
            services/natalCatalogServiceBase.ts \
            lib/natalReading/reportCatalogGenerationBase.ts
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-natal-direct-hotfix.py')
          source = path.read_text(encoding='utf-8')
          helper_anchor = '''def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one anchor, found {count}")
              return content.replace(old, new, 1)
          '''.replace('          ', '')
          helper_replacement = helper_anchor + '''

          def replace_first(content: str, old: str, new: str, label: str) -> str:
              if old not in content:
                  raise RuntimeError(f"{label}: anchor not found")
              return content.replace(old, new, 1)
          '''.replace('          ', '')
          if helper_anchor not in source:
              raise RuntimeError('replace_once helper anchor not found')
          source = source.replace(helper_anchor, helper_replacement, 1)

          def use_first_for_label(value: str, label: str) -> str:
              label_index = value.index(f'"{label}",')
              call_index = value.rfind('content = replace_once(', 0, label_index)
              if call_index < 0:
                  raise RuntimeError(f'{label}: replace_once call not found')
              return value[:call_index] + value[call_index:].replace(
                  'content = replace_once(',
                  'content = replace_first(',
                  1,
              )

          source = use_first_for_label(source, 'category generation state')
          source = use_first_for_label(source, 'category repair call')
          path.write_text(source, encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-natal-direct-hotfix.py
          python3 scripts/apply-natal-direct-hotfix.py

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: npm run migrate

      - name: Run tests
        run: npm test -- --runInBand

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build web application
        run: npm run build

      - name: Commit verified direct implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout 54cced79a292dd6cae79db929a0089ea41951021 -- .github/workflows/ci.yml
          git rm --ignore-unmatch \
            .github/workflows/natal-direct-hotfix.yml \
            scripts/apply-natal-direct-hotfix.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(natal): integrate admin variants in canonical flow"
          git push origin HEAD:fix/natal-reading-variants-20260902
