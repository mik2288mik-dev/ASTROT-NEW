name: Sync natal v3 with latest main

on:
  push:
    branches:
      - feat/natal-meaning-map-v3-20260902

permissions:
  contents: write

concurrency:
  group: sync-natal-v3-with-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/natal-meaning-map-v3-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main and resolve the app-shell overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_STATUS=$?
          set -e
          if [ "$MERGE_STATUS" -ne 0 ]; then
            git checkout --theirs -- \
              components/public-site/PublicSiteShell.tsx \
              pages/site.tsx \
              styles/PublicSeoHome.module.css \
              styles/publicSiteDocument.css
            git checkout --ours -- pages/_app.tsx
            git add \
              components/public-site/PublicSiteShell.tsx \
              pages/site.tsx \
              styles/PublicSeoHome.module.css \
              styles/publicSiteDocument.css \
              pages/_app.tsx
          fi
          grep -Fq "import '../styles/natalMeaningMap.css';" pages/_app.tsx
          grep -Fq "import '../styles/publicSiteDocument.css';" pages/_app.tsx
          grep -Fq "import { useEffect } from 'react';" pages/_app.tsx
          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: sync latest main into natal meaning map"
          fi
          git push origin HEAD:feat/natal-meaning-map-v3-20260902
