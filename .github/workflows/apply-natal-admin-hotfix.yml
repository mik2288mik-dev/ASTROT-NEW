name: Apply natal admin hotfix

on:
  push:
    branches:
      - fix/natal-admin-variant-and-reliability-20260902

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_SESSION_SECRET: branch-validation-session-secret
      DATABASE_URL: postgresql://horoscope:horoscope@127.0.0.1:5432/horoscope_test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/natal-admin-variant-and-reliability-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source patch
        run: |
          python3 scripts/apply-natal-admin-hotfix.py
          python3 scripts/fix-natal-hotfix-logger.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: >-
          npm test -- --runInBand
          __tests__/natal-reading-variant.test.ts
          __tests__/natal-reading-variant-ui-contract.test.ts
          __tests__/natal-catalog-repair-diagnostics.test.ts
          __tests__/natal-catalog-contract.test.ts
          __tests__/natal-mobile-interaction-contract.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f \
            scripts/apply-natal-admin-hotfix.py \
            scripts/fix-natal-hotfix-logger.py \
            .github/workflows/apply-natal-admin-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(natal): add admin variants and resilient catalog validation"
          git push origin HEAD:fix/natal-admin-variant-and-reliability-20260902
