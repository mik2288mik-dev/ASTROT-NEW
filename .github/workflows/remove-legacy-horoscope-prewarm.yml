name: Remove legacy personal horoscope prewarm from App

on:
  push:
    branches:
      - refactor/simple-ai-horoscope-path
    paths:
      - .github/workflows/remove-legacy-horoscope-prewarm.yml

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/simple-ai-horoscope-path
          fetch-depth: 0
      - name: Remove chart-dependent personal horoscope prewarm
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('App.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace("import { prewarmUserContent } from './services/contentPrewarmService';\n", '')
          text = text.replace("import { CACHE_ONLY_PREWARM_BUDGET_MS } from './lib/appStartupFlags';\n", '')
          text = text.replace(
              "import type { PersonalForecastPeriod } from './lib/personalForecastContract';",
              "import type { AiPersonalHoroscopePeriod as PersonalForecastPeriod } from './lib/aiPersonalHoroscope';",
          )
          text = text.replace("    const prewarmCompletedKeyRef = useRef<string | null>(null);\n", '')
          text = text.replace("            prewarmCompletedKeyRef.current = null;\n", '')

          text, count = re.subn(
              r"\n    const prepareUserContentDbFirst = useCallback\(async \(input: \{.*?\n    \}, \[prefetchBaseReportForChart\]\);\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'prepareUserContentDbFirst block replacements: {count}')

          text, count = re.subn(
              r"\n                void prepareUserContentDbFirst\(\{.*?\n                    \}\);",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'startup prepare call replacements: {count}')

          text, count = re.subn(
              r"\n                    return prepareUserContentDbFirst\(\{.*?\n                    \}\);",
              "\n                    return undefined;",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'onboarding prepare call replacements: {count}')

          text, count = re.subn(
              r"\n            if \(hasReadableNatalChart\(freshChart\)\) \{\n                void prepareUserContentDbFirst\(\{.*?\n                \}\);\n            \}",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'refresh prepare call replacements: {count}')

          text = text.replace(
              "    }, [loadPrimaryChartOnce, prepareUserContentDbFirst, resetPrimaryChartState, resolveAuthoritativeAdminStatus, getFallbackAdminStatus, startupRetryNonce]);",
              "    }, [loadPrimaryChartOnce, resetPrimaryChartState, resolveAuthoritativeAdminStatus, getFallbackAdminStatus, startupRetryNonce]);",
          )
          text = text.replace(
              "    }, [prefetchBaseReportForChart, prepareUserContentDbFirst, primaryChartId, profile]);",
              "    }, [prefetchBaseReportForChart, primaryChartId, profile]);",
          )

          forbidden = [
              'prepareUserContentDbFirst',
              'prewarmUserContent',
              'CACHE_ONLY_PREWARM_BUDGET_MS',
              'prewarmCompletedKeyRef',
              "./lib/personalForecastContract",
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'legacy references remain: {remaining}')
          if text == original:
              raise SystemExit('App.tsx was not changed')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit App cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "refactor: detach horoscope prewarm from natal chart"
          git push origin HEAD:refactor/simple-ai-horoscope-path
