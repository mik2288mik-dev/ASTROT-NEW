apply plugin: 'com.android.application'

def appPackageId = 'ru.tvoygoroskop.app'
def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file('signing.properties')
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}
def signingValue = { String name -> project.findProperty(name) ?: System.getenv(name) ?: localSigningProperties.getProperty(name) }
def releaseStoreFileValue = signingValue('RELEASE_STORE_FILE')
def releaseStorePasswordValue = signingValue('RELEASE_STORE_PASSWORD')
def releaseKeyAliasValue = signingValue('RELEASE_KEY_ALIAS')
def releaseKeyPasswordValue = signingValue('RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFileValue && releaseStorePasswordValue && releaseKeyAliasValue && releaseKeyPasswordValue
def authValue = { String name -> (project.findProperty(name) ?: System.getenv(name) ?: '').toString().trim() }
def buildConfigString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def googleAuthClientId = authValue('GOOGLE_AUTH_CLIENT_ID')
def googleAuthHandlerClass = 'ru.tvoygoroskop.app.auth.GoogleIdentityAuthHandler'
def yandexAuthClientId = authValue('YANDEX_AUTH_CLIENT_ID')
def vkAuthClientId = authValue('VK_AUTH_CLIENT_ID')
def vkIdAndroidClientSecret = authValue('VK_ID_ANDROID_CLIENT_SECRET')
def vkIdConfigured = !vkAuthClientId.isEmpty() && !vkIdAndroidClientSecret.isEmpty()
def rustoreConsoleAppId = project.findProperty('RUSTORE_CONSOLE_APP_ID') ?: System.getenv('RUSTORE_CONSOLE_APP_ID') ?: 'RUSTORE_CONSOLE_APP_ID_REQUIRED'
def rustoreScheme = project.findProperty('RUSTORE_PAY_SCHEME') ?: System.getenv('RUSTORE_PAY_SCHEME') ?: "${appPackageId}.rustore"
def rustorePaymentsEnabledValue = (System.getenv('NEXT_PUBLIC_RUSTORE_PAYMENTS_ENABLED') ?: project.findProperty('NEXT_PUBLIC_RUSTORE_PAYMENTS_ENABLED') ?: '0').toString()
def rustorePaymentsEnabled = ['1', 'true', 'yes', 'on'].contains(rustorePaymentsEnabledValue.trim().toLowerCase())
def appVersionCodeValue = System.getenv('APP_VERSION_CODE') ?: project.findProperty('APP_VERSION_CODE') ?: '1'
def appVersionNameValue = System.getenv('APP_VERSION_NAME') ?: project.findProperty('APP_VERSION_NAME') ?: '1.0.0'
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') && !it.toLowerCase().contains('lint') }

if (releaseTaskRequested && !releaseSigningReady) {
    throw new GradleException('Release signing is required. Set RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.')
}

android {
    namespace = appPackageId
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId appPackageId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(appVersionCodeValue.toString())
        versionName appVersionNameValue.toString()
        manifestPlaceholders = [
            rustoreConsoleAppId: rustoreConsoleAppId,
            rustorePayScheme: rustoreScheme,
            YANDEX_CLIENT_ID: yandexAuthClientId ?: '0',
            VKIDClientID: vkAuthClientId ?: '0',
            VKIDClientSecret: vkIdAndroidClientSecret ?: 'VK_ID_ANDROID_CLIENT_SECRET_REQUIRED',
            VKIDRedirectHost: 'vk.ru',
            VKIDRedirectScheme: vkAuthClientId ? "vk${vkAuthClientId}" : 'vk0',
        ]
        buildConfigField 'boolean', 'RUSTORE_PAYMENTS_ENABLED', rustorePaymentsEnabled ? 'true' : 'false'
        buildConfigField 'String', 'GOOGLE_AUTH_SERVER_CLIENT_ID', '""'
        buildConfigField 'boolean', 'GOOGLE_AUTH_ENABLED', 'false'
        buildConfigField 'String', 'OPTIONAL_IDENTITY_AUTH_HANDLER_CLASS', buildConfigString('')
        buildConfigField 'String', 'YANDEX_AUTH_CLIENT_ID', buildConfigString(yandexAuthClientId)
        buildConfigField 'String', 'VK_ID_CLIENT_ID', buildConfigString(vkAuthClientId)
        buildConfigField 'boolean', 'VK_ID_CONFIGURED', vkIdConfigured ? 'true' : 'false'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFileValue)
                storePassword releaseStorePasswordValue
                keyAlias releaseKeyAliasValue
                keyPassword releaseKeyPasswordValue
            }
        }
    }
    flavorDimensions += 'distribution'
    productFlavors {
        development {
            dimension 'distribution'
            buildConfigField 'String', 'DISTRIBUTION_CHANNEL', '"development"'
            buildConfigField 'String', 'GOOGLE_AUTH_SERVER_CLIENT_ID', buildConfigString(googleAuthClientId)
            buildConfigField 'boolean', 'GOOGLE_AUTH_ENABLED', 'true'
            buildConfigField 'String', 'OPTIONAL_IDENTITY_AUTH_HANDLER_CLASS', buildConfigString(googleAuthHandlerClass)
        }
        telegram {
            dimension 'distribution'
            buildConfigField 'String', 'DISTRIBUTION_CHANNEL', '"telegram"'
        }
        rustore {
            dimension 'distribution'
            buildConfigField 'String', 'DISTRIBUTION_CHANNEL', '"rustore"'
            manifestPlaceholders = [rustoreConsoleAppId: rustoreConsoleAppId, rustorePayScheme: rustoreScheme]
        }
        googlePlay {
            dimension 'distribution'
            buildConfigField 'String', 'DISTRIBUTION_CHANNEL', '"google_play"'
            buildConfigField 'String', 'GOOGLE_AUTH_SERVER_CLIENT_ID', buildConfigString(googleAuthClientId)
            buildConfigField 'boolean', 'GOOGLE_AUTH_ENABLED', 'true'
            buildConfigField 'String', 'OPTIONAL_IDENTITY_AUTH_HANDLER_CLASS', buildConfigString(googleAuthHandlerClass)
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        development.java.srcDir 'src/googleAuth/java'
        googlePlay.java.srcDir 'src/googleAuth/java'
    }
    buildTypes {
        debug {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    developmentImplementation 'androidx.credentials:credentials:1.6.0'
    developmentImplementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    developmentImplementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    googlePlayImplementation 'androidx.credentials:credentials:1.6.0'
    googlePlayImplementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    googlePlayImplementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.yandex.android:authsdk:3.1.3'
    implementation 'com.vk.id:vkid:2.7.2'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    rustoreImplementation platform('ru.rustore.sdk:bom:2026.08.01')
    rustoreImplementation 'ru.rustore.sdk:pay'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
