name: Validate NEBO parity pass 4
on:
  push:
    branches: [nebo-parity-pass4b-20260908]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nebo-parity-pass4
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint zodiac adapter
        run: npx eslint components/nebo-v2/NeboHoroscopeReader.tsx views/v2/HoroscopeReader.tsx views/v2/HoroscopeReaderClassic.tsx pages/_app.tsx --max-warnings=0
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Zodiac and access tests
        env:
          NODE_ENV: test
        run: npm test -- --runInBand __tests__/sign-horoscope-contract.test.ts __tests__/access-matrix.test.ts __tests__/nebo-admin-design.test.ts
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff hygiene
        run: git diff origin/main...HEAD --check
