name: Validate NEBO parity pass 3
on:
  push:
    branches: [nebo-parity-pass3-20260908]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nebo-parity-pass3
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint changed TypeScript
        run: npx eslint components/nebo-v2/NeboMatrixRoom.tsx components/nebo-v2/EntryPoints.tsx views/v2/MatrixRoom.tsx pages/_app.tsx --max-warnings=0
      - name: TypeScript
        run: npx tsc --noEmit
      - name: NEBO design tests
        env:
          NODE_ENV: test
        run: npm test -- --runInBand __tests__/nebo-admin-design.test.ts
      - name: Matrix calculation tests
        env:
          NODE_ENV: test
        run: npm test -- --runInBand __tests__/matrix-of-destiny.test.ts
      - name: Navigation shell tests
        env:
          NODE_ENV: test
        run: npm test -- --runInBand __tests__/today-navigation-shell.test.ts
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff hygiene
        run: git diff origin/main...HEAD --check
